name: Patch payout delivery UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[payout-ui-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch frontend payout delivery flow
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/main.jsx')
          s = p.read_text()
          original = s

          state = "  const [paidPayoutNotice, setPaidPayoutNotice] = useState(null);\n"
          anchor = "  const [adminMessage, setAdminMessage] = useState('Please wait up to 72 hours to receive your money.');\n"
          if 'paidPayoutNotice' not in s:
              if anchor not in s:
                  raise SystemExit('State anchor not found')
              s = s.replace(anchor, anchor + state, 1)

          latest = "  const latestPayout = withdrawals[0];\n"
          effect = '''  useEffect(() => {\n    if (!session?.user || isAdmin) return;\n    const paid = withdrawals.find(x => x.status === 'paid');\n    if (!paid) return;\n    const seenKey = `novapool:payout-seen:${session.user.id}:${paid.id}`;\n    if (window.localStorage.getItem(seenKey)) return;\n    setPaidPayoutNotice(paid);\n  }, [session?.user?.id, isAdmin, withdrawals]);\n'''
          if 'novapool:payout-seen:' not in s:
              if latest not in s:
                  raise SystemExit('Latest payout anchor not found')
              s = s.replace(latest, latest + effect, 1)

          banner = "  const payoutBanner = latestPayout &&"
          overlay = '''  const payoutSuccessOverlay = paidPayoutNotice && (\n    <div style={{ position: 'fixed', inset: 0, zIndex: 9999, background: 'radial-gradient(circle at 50% 35%, rgba(212,175,55,.18), rgba(5,5,5,.98) 58%)', display: 'grid', placeItems: 'center', padding: 22 }}>\n      <div style={{ width: 'min(680px, 100%)', textAlign: 'center', padding: '48px 28px 38px', borderRadius: 32, border: '1px solid rgba(212,175,55,.45)', background: 'linear-gradient(145deg, rgba(20,20,20,.98), rgba(7,7,7,.98))', boxShadow: '0 0 90px rgba(212,175,55,.16), inset 0 1px rgba(255,255,255,.06)', position: 'relative' }}>\n        <button aria-label="Close payout confirmation" onClick={() => { window.localStorage.setItem(`novapool:payout-seen:${session.user.id}:${paidPayoutNotice.id}`, '1'); setPaidPayoutNotice(null); setTab('home'); }} style={{ position: 'absolute', top: 16, right: 16, width: 44, height: 44, borderRadius: '50%', border: '1px solid rgba(255,255,255,.18)', background: 'rgba(255,255,255,.05)', color: '#fff', fontSize: 25, cursor: 'pointer' }}>×</button>\n        <div style={{ fontSize: 78, lineHeight: 1, marginBottom: 18 }}>🎉</div>\n        <div className="eyebrow" style={{ color: '#d4af37', letterSpacing: '.18em' }}>PAYOUT SUCCESS</div>\n        <h1 style={{ margin: '12px 0 14px', fontSize: 'clamp(30px, 7vw, 58px)', lineHeight: 1.02 }}>YOUR MONEY HAS BEEN RECEIVED</h1>\n        <p style={{ margin: '0 auto 22px', maxWidth: 520, color: 'rgba(255,255,255,.7)', fontSize: 16 }}>Your payout was successfully delivered by the NovaPool admin.</p>\n        <div style={{ fontSize: 'clamp(38px, 9vw, 64px)', fontWeight: 800, color: '#d4af37', marginBottom: 10 }}>{money(paidPayoutNotice.amount)}</div>\n        <div style={{ color: 'rgba(255,255,255,.58)', marginBottom: 28 }}>{paidPayoutNotice.network} · {dateText(paidPayoutNotice.paid_at)}</div>\n        <button className="primary-btn" onClick={() => { window.localStorage.setItem(`novapool:payout-seen:${session.user.id}:${paidPayoutNotice.id}`, '1'); setPaidPayoutNotice(null); setTab('home'); }} style={{ minWidth: 220 }}>Back to dashboard <span>→</span></button>\n      </div>\n    </div>\n  );\n\n'''
          if 'const payoutSuccessOverlay' not in s:
              if banner not in s:
                  raise SystemExit('Payout banner anchor not found')
              s = s.replace(banner, overlay + banner, 1)

          # Make the exact admin action wording explicit wherever the existing payout action is rendered.
          s = s.replace('Mark as sent', 'Money Delivered')
          s = s.replace('Mark as paid', 'Money Delivered')

          # Put the full-screen confirmation inside the authenticated application shell.
          if '{payoutSuccessOverlay}' not in s:
              shell = '<div className="app-shell">'
              if shell in s:
                  s = s.replace(shell, shell + '\n      {payoutSuccessOverlay}', 1)
              else:
                  # Fallback: inject immediately after the authenticated nav declaration.
                  nav_anchor = "  const nav = isAdmin ?"
                  if nav_anchor not in s:
                      raise SystemExit('App shell/nav anchor not found')
                  # This fallback is intentionally disabled rather than risking invalid JSX.
                  raise SystemExit('App shell anchor not found')

          if s == original:
              print('No changes required')
          else:
              p.write_text(s)
              print('Payout UI patched')
      - name: Commit payout UI patch
        run: |
          git config user.name "NovaPool Bot"
          git config user.email "novapool-bot@users.noreply.github.com"
          git add src/main.jsx
          git diff --cached --quiet || git commit -m "Fix payout delivery confirmation [payout-ui-patch]"
          git push
